<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No as a Service</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>No as a Service</h1>
            <p>Your daily dose of rejection.</p>
        </header>
        
        <main>
            <div id="result-box" class="result-box">
                <span class="loader">Loading...</span>
            </div>
            <button id="get-no-btn" class="refresh-btn">Get another No</button>
        </main>
    </div>

    <script>
        const resultBox = document.getElementById('result-box');
        const btn = document.getElementById('get-no-btn');

        async function fetchNo() {
            resultBox.innerHTML = '<span class="loader">Thinking...</span>';
            try {
                const response = await fetch('/no');
                const data = await response.json();
                resultBox.textContent = data.reason;
            } catch (error) {
                resultBox.textContent = "Error fetching rejection. Even the server says no to working.";
                console.error('Error:', error);
            }
        }

        btn.addEventListener('click', fetchNo);
        
        // Initial fetch
        fetchNo();
    </script>
</body>
</html>
