<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No as a Service</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="top-nav">
        <a href="https://github.com/hk151109" target="_blank" class="github-link">
            <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
            <span>GitHub</span>
        </a>
        <button id="theme-btn" class="theme-toggle">☀ Light Mode</button>
    </div>
    <div class="container">
        <header>
            <h1>No as a Service</h1>
            <p>Your daily dose of rejection.</p>
        </header>

        <main>
            <div id="result-box" class="result-box">
                <span class="loader">Loading...</span>
            </div>
            <button id="get-no-btn" class="refresh-btn">Get another No</button>
        </main>
    </div>

    <script>
        const resultBox = document.getElementById('result-box');
        const btn = document.getElementById('get-no-btn');
        const themeBtn = document.getElementById('theme-btn');

        // Theme Toggle Logic
        let isLight = false;
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            isLight = !isLight;
            themeBtn.textContent = isLight ? '☾ Dark Mode' : '☀ Light Mode';
        });

        async function fetchNo() {
            resultBox.innerHTML = '<span class="loader">Thinking...</span>';
            try {
                const response = await fetch('/no');
                const data = await response.json();
                resultBox.textContent = data.reason;
            } catch (error) {
                resultBox.textContent = "Error fetching rejection. Even the server says no to working.";
                console.error('Error:', error);
            }
        }

        btn.addEventListener('click', fetchNo);

        // Initial fetch
        fetchNo();
    </script>
</body>

</html>
